<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav: Navegación lateral -->
  <mat-sidenav #sidenav class="sidenav" [mode]="sidenavMode" [opened]="isSidenavOpened">
    <mat-nav-list>
      <a mat-list-item routerLink="/songs" (click)="sidenavMode==='over' ? sidenav.close() : null" routerLinkActive="active-link">
        <mat-icon>library_music</mat-icon>
        <span>Canciones</span>
      </a>
      <a mat-list-item routerLink="/artists" (click)="sidenavMode==='over' ? sidenav.close() : null" routerLinkActive="active-link">
        <mat-icon>group</mat-icon>
        <span>Artistas</span>
      </a>
      <a mat-list-item routerLink="/companies" (click)="sidenavMode==='over' ? sidenav.close() : null" routerLinkActive="active-link">
        <mat-icon>business</mat-icon>
        <span>Compañías</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content>
    <!-- Toolbar superior -->
    <mat-toolbar class="toolbar">
      <button mat-icon-button disableRipple (click)="toggleSidenav()" aria-label="Toggle navigation" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-title">{{ title }}</span>
      <span class="spacer"></span>
    </mat-toolbar>

    <!-- Área de contenido dinámico -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
